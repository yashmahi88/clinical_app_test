[project]
name = "clinical-appointment-manager"
version = "0.1.0"
description = "Medical appointment management platform for clinic reception staff (synthetic data only)"
requires-python = ">=3.10"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
"app/routers/*.py" = ["B008"]  # FastAPI Depends()/Query() defaults are idiomatic
"app/main.py" = ["B008"]
"tests/*" = ["B008"]
